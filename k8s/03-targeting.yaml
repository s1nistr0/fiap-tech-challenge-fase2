apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-config
  namespace: targeting
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-secret
  namespace: targeting
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXM6Ly90b2dnbGU6VFJPQ0FSX1NFTkhBQFRST0NBUi1FTkRQT0lOVC1SRFMtVEFSR0VUSU5HLnVzLWVhc3QtMS5yZHMuYW1hem9uYXdzLmNvbTo1NDMyL3RhcmdldGluZ19kYj9zc2xtb2RlPXJlcXVpcmU=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: targeting
  labels:
    app: targeting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: targeting-service
          image: TROCAR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/targeting-service:v1
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: targeting-config
            - secretRef:
                name: targeting-secret
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                # da tempo do endpoint sumir do service antes do SIGTERM chegar.
                # sem isso o nginx ainda manda request pro pod que ja esta morrendo.
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: targeting
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: targeting-ingress
  namespace: targeting
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # aqui a rota da aplicacao e /rules, nao /targeting
          - path: /rules
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003
