apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-config
  namespace: flags
data:
  PORT: "8002"
  # DNS interno do cluster: <service>.<namespace>.svc.cluster.local
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-secret
  namespace: flags
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXM6Ly90b2dnbGU6VFJPQ0FSX1NFTkhBQFRST0NBUi1FTkRQT0lOVC1SRFMtRkxBR1MudXMtZWFzdC0xLnJkcy5hbWF6b25hd3MuY29tOjU0MzIvZmxhZ3NfZGI/c3NsbW9kZT1yZXF1aXJl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: flags
  labels:
    app: flag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: TROCAR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-config
            - secretRef:
                name: flag-secret
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: flags
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flag-ingress
  namespace: flags
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # a rota da aplicacao ja e /flags, entao passa direto sem rewrite
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 8002
